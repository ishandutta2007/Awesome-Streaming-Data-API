<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic background animations */
    .stream-line {
      stroke-dasharray: 20 10;
      animation: flow 15s linear infinite;
    }
    .pulse-dot {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes flow {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 9px; opacity: 0.9; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Background Dynamic Graphic Elements (behind text) -->
  <g opacity="0.25">
    <path class="stream-line" d="M -50 220 Q 300 100 600 220 T 1250 150" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path class="stream-line" d="M -50 150 Q 400 280 800 120 T 1250 240" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path class="stream-line" d="M -50 80 Q 200 240 700 80 T 1250 180" fill="none" stroke="#c084fc" stroke-width="2"/>
    
    <circle cx="200" cy="160" class="pulse-dot" fill="#38bdf8"/>
    <circle cx="500" cy="220" class="pulse-dot" fill="#818cf8"/>
    <circle cx="850" cy="110" class="pulse-dot" fill="#c084fc"/>
    <circle cx="1050" cy="190" class="pulse-dot" fill="#38bdf8"/>
  </g>

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0 50 H 1200 M 0 100 H 1200 M 0 150 H 1200 M 0 200 H 1200 M 0 250 H 1200"/>
    <path d="M 100 0 V 300 M 200 0 V 300 M 300 0 V 300 M 400 0 V 300 M 500 0 V 300 M 600 0 V 300 M 700 0 V 300 M 800 0 V 300 M 900 0 V 300 M 1000 0 V 300 M 1100 0 V 300"/>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="115" y="76" text-anchor="middle" class="badge">⚡ REAL-TIME DATA &amp; EVENT APIs</text>

    <!-- Main Title -->
    <text x="0" y="142" class="title">Awesome Streaming Data API 🚀</text>

    <!-- Gradient Accent Line -->
    <rect x="0" y="162" width="640" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated List of SaaS Platforms &amp; Open-Source Event Streaming Engines</text>
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">
      Kafka • Redpanda • Flink • Pulsar • Kinesis • Debezium • Centrifugo • Ably
    </text>
  </g>
</svg>
