<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{r:4px;opacity:.4}}.badge,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:52px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge{font-weight:600;font-size:14px;fill:#38bdf8}.stream-line{stroke-dasharray:20 10;animation:flow 15s linear infinite}.pulse-dot{animation:pulse 3s ease-in-out infinite alternate}</style><rect width="1200" height="300" fill="url(#bg)" rx="16"/><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="3" d="M -50 220 Q 300 100 600 220 T 1250 150" class="stream-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50 150 Q 400 280 800 120 T 1250 240" class="stream-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M -50 80 Q 200 240 700 80 T 1250 180" class="stream-line"/><circle cx="200" cy="160" fill="#38bdf8" class="pulse-dot"/><circle cx="500" cy="220" fill="#818cf8" class="pulse-dot"/><circle cx="850" cy="110" fill="#c084fc" class="pulse-dot"/><circle cx="1050" cy="190" fill="#38bdf8" class="pulse-dot"/></g><g stroke="#fff" stroke-width="1" opacity=".04"><path d="M 0 50 H 1200 M 0 100 H 1200 M 0 150 H 1200 M 0 200 H 1200 M 0 250 H 1200"/><path d="M 100 0 V 300 M 200 0 V 300 M 300 0 V 300 M 400 0 V 300 M 500 0 V 300 M 600 0 V 300 M 700 0 V 300 M 800 0 V 300 M 900 0 V 300 M 1000 0 V 300 M 1100 0 V 300"/></g><g transform="translate(80, 0)"><rect width="230" height="32" x="0" y="55" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="115" y="76" class="badge" text-anchor="middle">⚡ REAL-TIME DATA &amp; EVENT APIs</text><text x="0" y="142" class="title">Awesome Streaming Data API 🚀</text><rect width="640" height="4" x="0" y="162" fill="url(#accent)" filter="url(#glow)" rx="2"/><text x="0" y="205" class="subtitle">Curated List of SaaS Platforms &amp; Open-Source Event Streaming Engines</text><text x="0" y="235" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16">Kafka • Redpanda • Flink • Pulsar • Kinesis • Debezium • Centrifugo • Ably</text></g></svg>